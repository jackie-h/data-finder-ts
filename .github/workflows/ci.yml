name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci

      - name: Generate TypeScript finders (programmatic)
        run: npm run generate

      - name: Generate TypeScript finders (dual association)
        run: npm run generate:dual-assoc

      - name: Generate TypeScript finders (all examples)
        run: npm run generate:examples

      - name: Generate TypeScript finders (GraphQL examples)
        run: npm run generate:graphql

      - name: Check spec tests are up to date with the Python specs
        run: |
          npm run generate:specs
          git diff --exit-code tests/specs

      - name: Type-check TypeScript
        run: npm run build

      - name: Build library (tsup)
        run: npm run build:lib

      - name: Run tests
        run: npm test

  er-diagram:
    name: ER diagrams
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: er-diagram/package-lock.json

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci --prefix er-diagram

      - name: Test the diagram generator
        run: npm test --prefix er-diagram

      - name: Test the JSON export
        run: npm run test:export --prefix er-diagram

      - name: Build the diagrams (model and mapping markdown to HTML)
        run: npm run generate --prefix er-diagram

      - name: Upload the diagrams
        uses: actions/upload-artifact@v4
        with:
          name: er-diagrams
          path: er-diagram/out
          if-no-files-found: error

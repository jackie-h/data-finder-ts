name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # the release runs these same jobs before it publishes

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci

      - name: Generate TypeScript finders (programmatic)
        run: npm run generate

      - name: Generate TypeScript finders (dual association)
        run: npm run generate:dual-assoc

      - name: Generate TypeScript finders (all examples)
        run: npm run generate:examples

      - name: Generate TypeScript finders (GraphQL examples)
        run: npm run generate:graphql

      - name: Check spec tests are up to date with the Python specs
        run: |
          npm run generate:specs
          git diff --exit-code tests/specs tests/spark

      - name: Type-check TypeScript
        run: npm run build

      - name: Build library (tsup)
        run: npm run build:lib

      - name: Run tests
        run: npm test

  spark:
    name: Spark specs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies (with PySpark, which ships the Spark that is run)
        run: uv sync --extra spark

      - name: Install Node dependencies
        run: npm ci

      - name: Generate TypeScript finders (all examples)
        run: npm run generate:examples

      - name: Cache the Spark Connect jar and its dependencies
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: spark-connect-3.5.9

      - name: Run the specs against a local Spark over Spark Connect
        run: npm run test:spark

      - name: Show the Spark server log if the specs failed
        if: failure()
        run: cat .spark/server.log || true

  er-diagram:
    name: ER diagrams
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: er-diagram/package-lock.json

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci --prefix er-diagram

      - name: Test the diagram generator
        run: npm test --prefix er-diagram

      - name: Build the diagrams (model and mapping markdown to HTML)
        run: npm run generate --prefix er-diagram

      - name: Check the package contents
        run: npm pack --dry-run --prefix er-diagram

      - name: Upload the diagrams
        uses: actions/upload-artifact@v4
        with:
          name: er-diagrams
          path: er-diagram/out
          if-no-files-found: error

  query-ui:
    name: Query UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: query-ui/package-lock.json

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix query-ui

      - name: Generate the finders and metadata the UI offers
        run: npm run generate --prefix query-ui

      - name: Type-check and build the UI
        run: npm run build --prefix query-ui

      - name: Build the libraries
        run: |
          npm run build:lib
          npm run build:lib --prefix query-ui

      - name: Install the packages as a user would, build a page with the CLI and serve it
        run: bash query-ui/scripts/smoke.sh
